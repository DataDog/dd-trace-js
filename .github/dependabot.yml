# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Regular github actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
      - "/.github/actions/*/*"
      - "/.github/workflows/*"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "23:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 5
      exclude:
        - "@datadog/*"
    groups:
      gh-actions-packages:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependabot
      - dependencies
      - github_actions
      - semver-patch

  # Docker base images in our Dockerfiles. Already digest-pinned references
  # (image:tag@sha256:...) get both the tag and the digest bumped on each
  # release; bare tags would only have the tag bumped, so every FROM here is
  # pinned by digest. docker-compose.yml is handled separately (GHCR mirror).
  - package-ecosystem: "docker"
    directories:
      - "/.github/editorconfig-checker"
      - "/.github/playwright"
      - "/.github/browser-tools"
      - "/benchmark/sirun"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 5
    labels:
      - dependabot
      - dependencies
      - docker
      - semver-patch
    groups:
      docker-images:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"

  # NOTE: package.electron.json is intentionally NOT listed here. It is gitignored
  # and generated at prepare time by scripts/generate-electron-package.js.
  # Dependabot bumps deps in package.json; the electron variant is always regenerated
  # fresh on the next npm install / npm pack.

  # Packages installed by Bun
  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "01:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 5
      exclude:
        - "@datadog/*"
    versioning-strategy: "increase"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    ignore:
      # Internal dependencies that we update manually
      - dependency-name: "@datadog/libdatadog"
      - dependency-name: "@datadog/native-appsec"
      - dependency-name: "@datadog/native-iast-taint-tracking"
      - dependency-name: "@datadog/native-metrics"
      - dependency-name: "@datadog/pprof"
      - dependency-name: "@datadog/sketches-js"
      - dependency-name: "@datadog/wasm-js-rewriter"

      - dependency-name: "@types/node"
        # Update the types manually with new Node.js version support
        update-types: ["version-update:semver-major"]
      - dependency-name: "glob"
        # 11.0.0 onwards only supports Node.js 20 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "nock"
        # 15.x does not support Node.js 18.
        versions: ["15.x"]
      - dependency-name: "@opentelemetry/core"
        # 2.0.0 onwards only supports Node.js 18.19.0 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/resources"
        # 2.0.0 onwards only supports Node.js 18.19.0 and above
        update-types: ["version-update:semver-major"]
        # @opentelemetry/api and @opentelemetry/api-logs have to be widened, not increased.
        # Thus, we ignore them and update them manually.
      - dependency-name: "@opentelemetry/api"
      - dependency-name: "@opentelemetry/api-logs"
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
    groups:
      dev-minor-and-patch-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      runtime-minor-and-patch-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security fixes for shipped (production) dependencies; a human reviews majors.
      security-production:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
      # Security fixes for dev-only dependencies; auto-merges fully.
      security-non-production:
        applies-to: security-updates
        dependency-type: "development"
        patterns:
          - "*"

  # Separate CI and docs dependencies from packages shipped to customers.
  - package-ecosystem: "bun"
    directories:
      - "/docs"
      - "/.github/all-green"
      - "/.github/workflow-job-names"
      - "/.github/actions/datadog-ci"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "01:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 5
      exclude:
        - "@datadog/*"
    versioning-strategy: "increase"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    groups:
      ci-and-docs:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"

  # Vendored dependencies
  - package-ecosystem: "bun"
    directories:
      - "/vendor"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 5
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    ignore:
      - dependency-name: "jest-docblock"
        # 30.0.0 onwards only supports Node.js 18.14.x and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonpath-plus"
        # Major updates require Node.js 22 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "https-proxy-agent"
        # 8.0.0 onwards only supports Node.js 22 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "lru-cache"
        # 11.0.0 onwards only supports Node.js 20 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "limiter"
        # 2.0.0 onwards breaks our tests. 3.0.0 works but it requires Node.js v16.
        # That breaks cypress in our v5 release line. Update when v5 is EOL.
        # Reverting this commit should suffice.
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/core"
        # 2.0.0 onwards only supports Node.js 18.19.0 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/resources"
        # 2.0.0 onwards only supports Node.js 18.19.0 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "meriyah"
        # 7.0.0 onwards only supports Node.js 20 and above
        update-types: ["version-update:semver-major"]
      - dependency-name: "@rspack/*"
        # 2.0.0 onwards only supports Node.js 20 and above
        update-types: ["version-update:semver-major"]
    groups:
      vendor-minor-and-patch-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Vendored code is bundled into the shipped package, so it counts as production.
      security-production:
        applies-to: security-updates
        patterns:
          - "*"

  # Instrumented library support range
  - package-ecosystem: "npm"
    directories:
      - "/packages/dd-trace/test/plugins/versions"
    schedule:
      interval: "cron"
      cronjob: "0 23 * * 0-4"
      timezone: "America/New_York"
    open-pull-requests-limit: 4
    cooldown:
      default-days: 3
      exclude:
        - "@datadog/*"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    ignore:
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "office-addin-mock"
        # Pinned to 2.x due to compatibility issues with newer major versions
        update-types: ["version-update:semver-major"]
      - dependency-name: "nock"
        # 15.x does not support Node.js 18.
        versions: ["15.x"]
    # TODO: Restore more focused groups after moving these scheduled version updates to
    # Renovate, which can schedule groups independently.
    # A dependency lands in the first group it matches. `test-versions` is the catch-all for
    # testing, build tools, runtimes, package managers, and miscellaneous dependencies.
    groups:
      ai-cloud-and-observability:
        patterns:
          - "@ai-sdk/*"
          - "@anthropic-ai/*"
          - "@aws-sdk/*"
          - "@aws/*"
          - "@azure/*"
          - "@datadog/openfeature-node-server"
          - "@google-cloud/vertexai"
          - "@google/genai"
          - "@langchain/*"
          - "@modelcontextprotocol/*"
          - "@openai/*"
          - "@openfeature/*"
          - "@opentelemetry/*"
          - "@smithy/*"
          - "@typesafe-ai/sdk"
          - "ai"
          - "aws-sdk"
          - "azure-functions-core-tools"
          - "browser-bunyan"
          - "bunyan"
          - "dd-trace-api"
          - "durable-functions"
          - "google-gax"
          - "langchain"
          - "openai"
          - "pino"
          - "pino-pretty"
          - "winston"
      data-and-messaging:
        patterns:
          - "@confluentinc/kafka-javascript"
          - "@elastic/*"
          - "@google-cloud/pubsub"
          - "@nats-io/*"
          - "@node-redis/*"
          - "@opensearch-project/*"
          - "@prisma/*"
          - "@redis/*"
          - "@supabase/*"
          - "@vscode/sqlite3"
          - "aerospike"
          - "amqp10"
          - "amqplib"
          - "avsc"
          - "bson"
          - "bullmq"
          - "cassandra-driver"
          - "couchbase"
          - "elasticsearch"
          - "generic-pool"
          - "ioredis"
          - "iovalkey"
          - "kafkajs"
          - "knex"
          - "limitd-client"
          - "mariadb"
          - "memcached"
          - "mongodb"
          - "mongodb-core"
          - "mongoose"
          - "mquery"
          - "mysql"
          - "mysql2"
          - "node-serialize"
          - "oracledb"
          - "pg"
          - "pg-cursor"
          - "pg-native"
          - "pg-query-stream"
          - "postgres"
          - "prisma"
          - "protobufjs"
          - "redis"
          - "rhea"
          - "sequelize"
          - "sharedb"
          - "sqlite3"
          - "tedious"
          - "zod"
          - "zod-to-json-schema"
      web-and-services:
        patterns:
          - "@apollo/*"
          - "@fastify/*"
          - "@graphql-tools/*"
          - "@grpc/*"
          - "@hapi/*"
          - "@hono/*"
          - "@koa/*"
          - "apollo-server-core"
          - "apollo-server-express"
          - "apollo-server-fastify"
          - "axios"
          - "body-parser"
          - "connect"
          - "cookie"
          - "cookie-parser"
          - "ejs"
          - "express"
          - "express-mongo-sanitize"
          - "express-session"
          - "fastify"
          - "find-my-way"
          - "graphql"
          - "graphql-jit"
          - "graphql-tag"
          - "graphql-tools"
          - "graphql-yoga"
          - "handlebars"
          - "hapi"
          - "hono"
          - "koa"
          - "koa-route"
          - "koa-router"
          - "koa-websocket"
          - "ldapjs"
          - "ldapjs-promise"
          - "light-my-request"
          - "loopback"
          - "mercurius"
          - "microgateway-core"
          - "middie"
          - "moleculer"
          - "multer"
          - "next"
          - "passport"
          - "passport-http"
          - "passport-local"
          - "pug"
          - "react"
          - "react-dom"
          - "request"
          - "restify"
          - "router"
          - "stripe"
          - "undici"
          - "ws"
      test-versions:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"

  # Esbuild integration test dependencies
  # Webpack fixtures use the same update policy.
  - package-ecosystem: "npm"
    directories:
      - "/integration-tests/esbuild"
      - "/integration-tests/appsec/iast-esbuild-esm"
      - "/integration-tests/appsec/iast-esbuild-cjs"
      - "/integration-tests/webpack"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * 1-5"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 3
      exclude:
        - "@datadog/*"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
    ignore:
      - dependency-name: "express"
        # Update express manually for now due to esbuild breaking otherwise
        update-types: ["version-update:semver-major"]
    groups:
      test-versions:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"

  # Feature Flagging test data shared across SDKs
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      feature-flagging-test-data:
        patterns:
          - "*"
    labels:
      - dependabot
      - dependencies
      - semver-patch

  # Keep startup benchmark inputs fixed until their frozen lock is updated together.
  - package-ecosystem: "npm"
    directory: "/benchmark/sirun/startup/everything-fixture"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
    groups:
      startup-benchmark:
        patterns:
          - "*"
      security-non-production:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependabot
      - dependencies
      - javascript
      - semver-patch
