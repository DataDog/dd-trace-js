name: Upload JUnit Artifacts
description: Upload JUnit XML test result files as GitHub Actions artifacts for later collection

inputs:
  id:
    description: Unique identifier for these artifacts — include all matrix variables for matrix jobs
    required: true

runs:
  using: composite
  steps:
    - if: github.actor != 'dependabot[bot]'
      id: check
      shell: bash
      run: |
        count=$(find . -maxdepth 1 -name "*.xml" | wc -l | tr -d ' ')
        echo "has_xml=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - if: github.actor != 'dependabot[bot]' && steps.check.outputs.has_xml == 'true'
      id: upload
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-${{ inputs.id }}
        path: "*.xml"
        retention-days: 1
    - if: github.actor != 'dependabot[bot]' && steps.check.outputs.has_xml == 'true' && steps.upload.outcome == 'failure'
      shell: bash
      run: sleep 10
    - if: github.actor != 'dependabot[bot]' && steps.check.outputs.has_xml == 'true' && steps.upload.outcome == 'failure'
      id: retry
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-${{ inputs.id }}
        path: "*.xml"
        overwrite: true
        retention-days: 1
    # Finalization can fail after GitHub stores the artifact. Only recover when the existing artifact
    # is downloadable and passes download-artifact's digest validation.
    - if: github.actor != 'dependabot[bot]' && steps.check.outputs.has_xml == 'true' && steps.retry.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: junit-${{ inputs.id }}
        path: ${{ runner.temp }}/artifact-verification/junit-${{ inputs.id }}
