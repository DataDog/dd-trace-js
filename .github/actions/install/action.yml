name: Install dependencies
description: Install dependencies
runs:
  using: composite
  steps:
    - name: Identify Bun cache
      id: bun-version
      run: echo "version=$(bun --version)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: bun-cache
      with:
        path: ${{ runner.temp }}/dd-trace-bun-cache.pack
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-version.outputs.version }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-version.outputs.version }}-
    - name: Unpack Bun cache
      continue-on-error: true
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/dd-trace-bun-cache.pack" ]; then
          bun pm cache unpack "$RUNNER_TEMP/dd-trace-bun-cache.pack"
        fi
    - run: bun install --frozen-lockfile --linker=hoisted
      shell: bash
    - name: Pack Bun cache
      if: steps.bun-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      run: bun pm cache pack "$RUNNER_TEMP/dd-trace-bun-cache.pack"
      shell: bash
