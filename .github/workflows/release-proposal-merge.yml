name: "[Release Proposal Merge]"

on:
  workflow_call:
    inputs:
      pull-request-number:
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pull-request-number }}
  cancel-in-progress: false

jobs:
  merge-release-proposal:
    name: Merge release proposal
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: release-proposal-merge
      - name: Check release proposal state
        id: proposal
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pull-request-number }}
          REQUIRED_LABEL: release-proposal-automerge
        run: |
          proposal=$(gh pr view "$PR_URL" \
            --json baseRefName,headRefName,headRefOid,isDraft,labels,reviewDecision,state)

          if ! jq -e --arg required_label "$REQUIRED_LABEL" '
            .state == "OPEN" and
            .isDraft == false and
            .reviewDecision == "APPROVED" and
            any(.labels[]; .name == $required_label) and
            (.baseRefName | test("^v[0-9]+\\.x$")) and
            (.headRefName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-proposal$"))
          ' <<< "$proposal" > /dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "eligible=true"
            echo "base_ref=$(jq -r .baseRefName <<< "$proposal")"
            echo "head_sha=$(jq -r .headRefOid <<< "$proposal")"
          } >> "$GITHUB_OUTPUT"
      - name: Wait for required checks
        if: steps.proposal.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pull-request-number }}
        run: gh pr checks "$PR_URL" --fail-fast --required --watch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.proposal.outputs.eligible == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.proposal.outputs.head_sha }}
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Fast-forward release branch
        if: steps.proposal.outputs.eligible == 'true'
        env:
          BASE_REF: ${{ steps.proposal.outputs.base_ref }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          HEAD_SHA: ${{ steps.proposal.outputs.head_sha }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ inputs.pull-request-number }}
          REQUIRED_LABEL: release-proposal-automerge
        run: |
          proposal=$(gh pr view "$PR_URL" \
            --json baseRefName,headRefName,headRefOid,isDraft,labels,reviewDecision,state)

          jq -e --arg head_sha "$HEAD_SHA" --arg required_label "$REQUIRED_LABEL" '
            .state == "OPEN" and
            .isDraft == false and
            .reviewDecision == "APPROVED" and
            any(.labels[]; .name == $required_label) and
            .headRefOid == $head_sha
          ' <<< "$proposal" > /dev/null

          git push origin "HEAD:refs/heads/$BASE_REF"
