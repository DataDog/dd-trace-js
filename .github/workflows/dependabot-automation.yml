name: "Dependabot Automation"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

env:
  # Direct production version update groups
  # (`runtime-minor-and-patch-dependencies`, `vendor-minor-and-patch-dependencies`) are
  # intentionally absent: they ship to customers and stay on manual review.
  GROUPS: >-
    ["gh-actions-packages", "docker-images",
    "ai-cloud-and-observability", "data-and-messaging", "web-and-services", "test-versions",
    "startup-benchmark", "feature-flagging-test-data", "security-non-production"]
  # Development/tooling and production security updates retain manual review for majors.
  MINOR_AND_PATCH_GROUPS: >-
    ["dev-minor-and-patch-dependencies", "ci-and-docs", "security-production"]

jobs:
  dependabot-automation:
    # Only run automation on the initial Dependabot-triggered run. If an automation commit is pushed
    # GitHub re-triggers this workflow with `github.actor == 'dd-octo-sts[bot]'`. We intentionally
    # avoid minting tokens / approving / enabling auto-merge on that follow-up run.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: dependabot-automation
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # 3.1.0
        with:
          github-token: "${{ steps.octo-sts.outputs.token }}"
      # Fixtures can declare production dependencies, so their groups are approved explicitly.
      # Ungrouped development and indirect updates are limited to minor and patch versions.
      - name: Check auto-merge eligibility
        id: eligibility
        if: >-
          contains(fromJSON(env.GROUPS), steps.metadata.outputs.dependency-group) ||
          (contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'),
          steps.metadata.outputs.update-type) &&
          (contains(fromJSON(env.MINOR_AND_PATCH_GROUPS), steps.metadata.outputs.dependency-group) ||
          contains(fromJSON('["direct:development", "indirect"]'), steps.metadata.outputs.dependency-type)))
        run: echo 'approve=true' >> "$GITHUB_OUTPUT"
      - name: Approve a PR
        if: steps.eligibility.outputs.approve == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Enable auto-merge for Dependabot PRs
        if: steps.eligibility.outputs.approve == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
