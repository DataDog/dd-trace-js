name: Audit

on:
  pull_request:
    paths:
      - ".github/audit-allowlist.json"
      - ".github/workflows/audit.yml"
      - ".github/actions/datadog-ci/bun.lock"
      - ".github/all-green/bun.lock"
      - "bun.lock"
      - "docs/bun.lock"
      - "scripts/audit.js"
      - "vendor/bun.lock"
  # Dependabot supports Bun version updates but not security updates, so a newly disclosed advisory does not change a
  # lockfile or open a pull request that would trigger this workflow.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - "."
          - ".github/actions/datadog-ci"
          - ".github/all-green"
          - "docs"
          - "vendor"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node/latest
      - run: node scripts/audit.js "$DIRECTORY"
        env:
          DIRECTORY: ${{ matrix.directory }}
