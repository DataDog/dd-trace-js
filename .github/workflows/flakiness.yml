name: "[Flakiness Report]"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to look back"
        default: "1"
        type: string
      branch:
        description: "Branch to filter (leave empty for all branches)"
        type: string
      occurrences:
        description: "Minimum number of occurrences to consider a test flaky"
        default: "1"
        type: string
  schedule:
    - cron: "0 6 * * 1"

jobs:
  flakiness:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    env:
      BRANCH: ${{ inputs.branch }}
      DAYS: ${{ inputs.days || '7' }}
      OCCURRENCES: ${{ inputs.occurrences || '2' }}
    steps:
      - name: Get GitHub Token via dd-octo-sts
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/dd-trace-js
          policy: self.flakiness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            package.json
            scripts
            yarn.lock
      - uses: ./.github/actions/node
        with:
          version: active
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node scripts/flakiness.mjs
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - run: cat flakiness.md >> "$GITHUB_STEP_SUMMARY"
      - id: duration
        continue-on-error: true
        run: node scripts/ci-duration.mjs
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - if: steps.duration.outcome == 'success'
        run: cat ci-duration.md >> "$GITHUB_STEP_SUMMARY"
      - id: slack
        run: |
          echo "flakiness=$(cat flakiness.txt)" >> "$GITHUB_OUTPUT"
          if [[ -f ci-duration.txt ]]; then
            echo "duration=$(cat ci-duration.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "duration=⚠️ CI duration report failed. See <$REPORT_URL|workflow run>." >> "$GITHUB_OUTPUT"
          fi
        env:
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.1.0
        if: github.event_name == 'schedule'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.slack.outputs.flakiness }}"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.slack.outputs.duration }}"
      - if: steps.duration.outcome == 'failure'
        run: exit 1
