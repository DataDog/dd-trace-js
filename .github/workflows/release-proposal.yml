name: "[Release Proposal]"

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 * * 1-5

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-branches:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      RELEASE_LINES: 5 6
    outputs:
      release-lines: ${{ steps.check.outputs.release-lines }}
    steps:
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: release-proposal
      - id: check
        run: |
          lines=()
          for line in $RELEASE_LINES; do
            if git ls-remote --heads \
              "https://x-access-token:${{ steps.octo-sts.outputs.token }}@github.com/DataDog/dd-trace-js.git" \
              "refs/heads/v${line}.x" | grep -q .; then
              lines+=("\"${line}\"")
            fi
          done
          echo "release-lines=[$(IFS=,; echo "${lines[*]}")]" >> "$GITHUB_OUTPUT"

  release-warning:
    needs: check-branches
    if: >
      github.event_name == 'schedule' &&
      needs.check-branches.outputs.release-lines != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: release-proposal
      - id: release-age
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          RELEASE_LINES: ${{ needs.check-branches.outputs.release-lines }}
        run: |
          releases=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | jq -s 'add')
          now=$(date -u +%s)
          stale_lines=()
          minimum_age=
          maximum_age=
          should_warn=false

          while IFS= read -r line; do
            published_at=$(jq -r --arg prefix "v${line}." '
              map(select(.draft == false and (.tag_name | startswith($prefix)))) |
              max_by(.published_at).published_at // empty
            ' <<< "$releases")

            if [ -z "$published_at" ]; then
              echo "No published release found for v${line}.x" >&2
              exit 1
            fi

            published=$(date -d "$published_at" +%s)
            age=$(((now - published) / 86400))

            if ((age < 7)); then
              continue
            fi

            stale_lines+=("v${line}")

            if [ -z "$minimum_age" ] || ((age < minimum_age)); then
              minimum_age=$age
            fi

            if [ -z "$maximum_age" ] || ((age > maximum_age)); then
              maximum_age=$age
            fi

            if (((age - 7) % 3 == 0)); then
              should_warn=true
            fi
          done < <(jq -r '.[]' <<< "$RELEASE_LINES")

          if [ "$should_warn" != true ]; then
            echo "warn=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ((${#stale_lines[@]} == 1)); then
            release_subject="Release line ${stale_lines[0]}"
            release_verb=has
            release_noun=release
          else
            last_index=$((${#stale_lines[@]} - 1))
            release_lines=${stale_lines[0]}
            for ((index = 1; index < last_index; index++)); do
              release_lines+=", ${stale_lines[index]}"
            done
            release_subject="Release lines ${release_lines} and ${stale_lines[last_index]}"
            release_verb=have
            release_noun=releases
          fi

          if ((maximum_age >= 14)); then
            icon=:rotating_light:
          else
            icon=:warning:
          fi

          echo "warn=true" >> "$GITHUB_OUTPUT"
          echo "days=$minimum_age" >> "$GITHUB_OUTPUT"
          echo "icon=$icon" >> "$GITHUB_OUTPUT"
          echo "release-noun=$release_noun" >> "$GITHUB_OUTPUT"
          echo "release-subject=$release_subject" >> "$GITHUB_OUTPUT"
          echo "release-verb=$release_verb" >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.1.0
        if: steps.release-age.outputs.warn == 'true'
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: >-
                    ${{ steps.release-age.outputs.icon }}
                    *${{ steps.release-age.outputs.release-subject }}*
                    ${{ steps.release-age.outputs.release-verb }} gone at least
                    ${{ steps.release-age.outputs.days }} days without a release.
                    Consider cutting the next
                    ${{ steps.release-age.outputs.release-noun }} soon.

  create-proposal:
    needs: check-branches
    if: needs.check-branches.outputs.release-lines != '[]'
    strategy:
      fail-fast: false
      matrix:
        release-line: ${{ fromJSON(needs.check-branches.outputs.release-lines) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: release-proposal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.octo-sts.outputs.token }}
      - uses: ./.github/actions/node
        with:
          version: ""
      - uses: ./.github/actions/install/branch-diff
        with:
          token: ${{ steps.octo-sts.outputs.token }}
      - id: proposal
        run: node scripts/release/proposal ${{ matrix.release-line }} -y ${{ github.event_name == 'workflow_dispatch' && '-f' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.1.0
        if: >
          github.event_name == 'schedule' &&
          steps.proposal.outputs.commit_count != '' &&
          fromJSON(steps.proposal.outputs.commit_count) >= 50 &&
          fromJSON(steps.proposal.outputs.commit_count) < 100
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: >-
                    :warning: *Release proposal
                    <${{ steps.proposal.outputs.pr_url }}|${{ steps.proposal.outputs.version }}>*
                    has ${{ steps.proposal.outputs.commit_count }} commits queued.
                    GitHub's rebase limit is 100 — once reached, commits that don't fit
                    will be deferred to a subsequent release.
                    Consider cutting this release soon.
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.1.0
        if: >
          github.event_name == 'schedule' &&
          steps.proposal.outputs.commit_count != '' &&
          fromJSON(steps.proposal.outputs.commit_count) >= 100
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: >-
                    :rotating_light: *Release proposal
                    <${{ steps.proposal.outputs.pr_url }}|${{ steps.proposal.outputs.version }}>*
                    has ${{ steps.proposal.outputs.commit_count }} commits queued.
                    GitHub's rebase limit of 100 has been reached — commits that don't fit
                    will be deferred to a subsequent release.
                    Consider cutting this release soon.
