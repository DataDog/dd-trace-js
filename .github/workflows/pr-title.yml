name: Pull Request Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches:
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Shared between both steps. Must stay portable across bash ERE and JS
      # regex (no lookarounds, named groups, or other JS-only features).
      # Revert PRs always get semver-patch regardless of the original change's type.
      PR_TITLE_PATTERN: '^(revert(!)?: .+|(feat|fix|docs|style|refactor|perf|test|bench|build|ci|chore)(\(([^)]+)\))?(!)?: .+)'
    steps:
      - name: Auto-rename GitHub revert title to Conventional Commit
        id: rename
        if: startsWith(github.event.pull_request.title, 'Revert "')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title
            const m = title.match(/^Revert "(.+)"$/)
            if (!m) return
            const newTitle = `revert: ${m[1]}`
            core.notice(`Auto-renaming PR title to: ${newTitle}`)
            await github.graphql(
              'mutation($input: UpdatePullRequestInput!) { updatePullRequest(input: $input) { clientMutationId } }',
              { input: { pullRequestId: context.payload.pull_request.node_id, title: newTitle } }
            )
            core.setOutput('renamed', 'true')

      - name: Checkout base revision
        if: steps.rename.outputs.renamed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fetch the PR head as Git objects only. The privileged pull_request_target
      # job must never check out or execute code from this ref.
      - name: Fetch pull request head
        if: steps.rename.outputs.renamed != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          git fetch --no-tags origin
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull-request/head"

      - name: Validate PR title and release-note context
        if: steps.rename.outputs.renamed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request
            const title = pullRequest.title || ''
            const match = title.match(new RegExp(process.env.PR_TITLE_PATTERN))
            if (!match) {
              core.setFailed('PR title does not follow Conventional Commits format.')
              return
            }
            core.info(`PR title OK: ${title}`)

            const type = match[3]
            if (!/^(?:feat|fix|perf|docs)$/.test(type)) return

            const { execFileSync } = require('node:child_process')
            const { isInternalOnly } = require('./scripts/release/changelog')
            // Treat renames as delete/add pairs so both paths affect classification.
            const output = execFileSync('git', [
              'diff',
              '--name-only',
              '--no-renames',
              '-z',
              `${pullRequest.base.sha}...refs/remotes/pull-request/head`,
            ], { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 })
            const files = output.split('\0').filter(Boolean)

            if (isInternalOnly(files)) {
              core.setFailed(`PR title type "${type}" is public, but every changed file is internal. ` +
                'Use test, bench, ci, or chore.')
            }

      - name: Sync labels with PR title
        if: >-
          steps.rename.outputs.renamed != 'true' &&
          (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          (github.event.action == 'edited' && github.event.changes.title != null))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pattern = new RegExp(process.env.PR_TITLE_PATTERN)
            const parse = (title) => {
              const m = (title || '').match(pattern)
              if (!m) return {}
              const isRevert = !m[3]
              return {
                type: isRevert ? 'revert' : m[3],
                scope: isRevert ? undefined : m[5],
                breaking: isRevert ? m[2] === '!' : m[6] === '!',
              }
            }

            // Reverts are always semver-patch regardless of the original change's type.
            const semverFor = ({ type, breaking }) => {
              if (!type) return undefined
              if (breaking) return 'semver-major'
              if (type === 'feat') return 'semver-minor'
              return 'semver-patch'
            }

            const pr = context.payload.pull_request
            const next = parse(pr.title)

            /** @param {{ type?: string, scope?: string, breaking?: boolean }} parsed */
            const titledLabels = (parsed) => {
              const labels = new Set()
              if (!parsed.type) return labels
              labels.add(parsed.type)
              if (parsed.scope) {
                for (const scope of parsed.scope.split(',')) {
                  const name = scope.trim()
                  if (name) labels.add(name)
                }
              }
              const semver = semverFor(parsed)
              if (semver) labels.add(semver)
              return labels
            }

            const nextLabels = titledLabels(next)
            const current = new Map()
            for (const label of pr.labels || []) current.set(label.name, label.node_id)
            const repoLabels = new Map(current)

            const variables = { ...context.repo }
            const declarations = ['$owner: String!', '$repo: String!']
            const fields = []
            const missing = []
            for (const name of nextLabels) {
              if (current.has(name)) continue
              const key = `label${missing.length}`
              missing.push(name)
              variables[key] = name
              declarations.push(`$${key}: String!`)
              fields.push(`${key}: label(name: $${key}) { id }`)
            }

            if (missing.length) {
              const { repository } = await github.graphql(
                `query(${declarations.join(', ')}) { repository(owner: $owner, name: $repo) { ${fields.join(' ')} } }`,
                variables
              )
              for (let index = 0; index < missing.length; index++) {
                const id = repository[`label${index}`]?.id
                if (id) repoLabels.set(missing[index], id)
              }
            }

            const semver = semverFor(next)
            if (semver && !repoLabels.has(semver)) throw new Error(`Missing repository label: ${semver}`)
            for (const name of nextLabels) {
              if (!repoLabels.has(name)) nextLabels.delete(name)
            }

            // When the title changes, remove labels from the old title that no
            // longer apply so stale type/scope/semver labels don't linger.
            const titleChanged = context.payload.action === 'edited' &&
              context.payload.changes?.title?.from != null
            const desired = new Map(current)
            if (titleChanged) {
              const prev = parse(context.payload.changes.title.from)
              for (const label of titledLabels(prev)) {
                if (!nextLabels.has(label)) desired.delete(label)
              }
            }

            for (const label of nextLabels) desired.set(label, repoLabels.get(label))

            let changed = current.size !== desired.size
            if (!changed) {
              for (const label of current.keys()) {
                if (!desired.has(label)) {
                  changed = true
                  break
                }
              }
            }
            if (changed) {
              await github.graphql(
                'mutation($input: UpdatePullRequestInput!) { updatePullRequest(input: $input) { clientMutationId } }',
                { input: { pullRequestId: pr.node_id, labelIds: [...desired.values()] } }
              )
            }
