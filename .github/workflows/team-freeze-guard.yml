# How to configure:
#
# When no team is frozen, set `frozen-teams` to an empty string:
# frozen-teams: ""
#
# When one or more teams are frozen, add them one per line with the @DataDog prefix:
#
# frozen-teams: |
#   @DataDog/team-a
#   @DataDog/team-b

name: Team freeze guard

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

jobs:
  team-freeze-guard:
    name: Team freeze guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: write # for team membership cache
    steps:
      - uses: DataDog/team-freeze-guard@d972736cb1c9ae781bdb3cf4564193eb27ee6339 # v0.0.6
        with:
          # subset of pattern defined here:
          # .github/workflows/pr-title.yml#L22C85-L23C128
          bypass-title-pattern: '^(revert(!)?: .+|(fix|test|ci)(\(([^)]+)\))?(!)?: .+)'
          frozen-teams: |
            @DataDog/apm-idm-js
            @DataDog/ml-observability
            @DataDog/lang-platform-js
