name: "CodeQL"

on:
  push:
    branches: [master, mq-working-branch-master-*]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # dd-octo-sts is used for checkout and init to reduce GITHUB_TOKEN rate-limit
  # consumption. The official analyze action uploads SARIF with github.token
  # (security-events: write) so GitHub derives the correct analysis_key from the
  # workflow context — raw API uploads always get "(default)" which the PR
  # Security tab does not recognise. wait-for-processing is disabled on the
  # action to avoid spending github.token budget on status polls; processing
  # completion is checked in a separate step using the dd-octo-sts token.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]

    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: codeql-analysis

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          fetch-depth: >-
            ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && 2 || 1 }}

      - name: Check CodeQL scope
        id: codeql-scope
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          !github.event.created && !github.event.deleted)
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_TOKEN: ${{ github.event_name == 'push' && steps.octo-sts.outputs.token || '' }}
        shell: bash
        run: |
          # Early exits leave skip unset so CodeQL still runs.

          # The shallow checkout can omit older push tips and completed analysis commits.
          fetch_commit() {
            git cat-file -e "$1^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$1"
          }

          # Treat renames as a deletion and an addition so either path can require a scan.
          no_changes_in_scope() {
            git diff --quiet --no-ext-diff --no-renames --ignore-submodules=none "$1" HEAD -- "${pathspecs[@]}"
          }

          # The PR merge commit's first parent holds the trusted base branch exclusions.
          base=HEAD^1
          config_ref=$base
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A push can span several commits. Compare its previous tip using the scan config at HEAD.
            base=$PUSH_BEFORE
            config_ref=HEAD
            [[ -n "$base" ]] || exit 0
            fetch_commit "$base" || exit 0
          fi

          # Translate the directory patterns that Git and CodeQL share. The trailing /** matches their contents.
          exclusions=$(git show "$config_ref:.github/codeql_config.yml" | yq --exit-status --unwrapScalar '
            .["paths-ignore"][]
            | select(tag == "!!str" and test("^[A-Za-z0-9._-]+(/([A-Za-z0-9._-]+|\\*\\*))*$"))
            | ":(exclude,glob)" + . + "/**"
          ') || exit 0
          mapfile -t pathspecs <<< "$exclusions"

          # Only pushes with no in-scope changes need a baseline lookup.
          no_changes_in_scope "$base" || exit 0

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A failed scan can leave source changes from earlier pushes unscanned.
            # Reuse only a completed analysis for this workflow, job, and language.
            workflow_path=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}
            workflow_path=${workflow_path%@*}
            analysis_key="$workflow_path:$GITHUB_JOB"
            analyzed_sha=$(curl -fsS --max-time 10 --get \
              -H "Authorization: Bearer $CODEQL_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-urlencode "ref=$GITHUB_REF" --data 'tool_name=CodeQL&per_page=1' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/code-scanning/analyses" |
              jq -er --arg ref "$GITHUB_REF" --arg key "$analysis_key" \
                --arg category "$analysis_key/language:$CODEQL_LANGUAGE" '
                .[0]
                | select(.ref == $ref and .analysis_key == $key and .category == $category and .error == "")
                | .commit_sha
                | select(type == "string" and test("^[0-9a-f]{40}$"))
              ') || exit 0
            if [[ "$analyzed_sha" != "$base" ]]; then
              fetch_commit "$analyzed_sha" || exit 0
              no_changes_in_scope "$analyzed_sha" || exit 0
            fi
            # Compare the workflow and config directly because paths-ignore can cover .github.
            git diff --quiet --no-ext-diff --no-renames "$analyzed_sha" HEAD -- \
              .github/codeql_config.yml "$workflow_path" || exit 0
          fi

          echo 'No changed files in CodeQL scope.'
          echo 'skip=true' >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        id: init-codeql
        if: steps.codeql-scope.outputs.skip != 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql_config.yml
          token: ${{ steps.octo-sts.outputs.token }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      - name: Perform CodeQL Analysis
        id: analyze
        if: steps.codeql-scope.outputs.skip != 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          token: ${{ github.token }}
          wait-for-processing: false

      - name: Wait for SARIF processing
        if: steps.codeql-scope.outputs.skip != 'true'
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
        run: |
          # Poll every 10s (30x = 5 min total), matching the official action's
          # timeout but halving the API calls vs its default 5s interval.
          for _ in $(seq 1 30); do
            RESULT=$(curl -sf --retry 5 --retry-delay 2 --retry-connrefused \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/code-scanning/sarifs/$SARIF_ID")
            STATUS=$(echo "$RESULT" | jq -r '.processing_status')
            echo "Processing status: $STATUS"
            if [ "$STATUS" = "complete" ]; then exit 0; fi
            if [ "$STATUS" = "failed" ]; then
              echo "$RESULT" | jq -r '.errors // empty'
              exit 1
            fi
            sleep 10
          done
          echo "SARIF processing did not complete within 5 minutes"
          exit 1
