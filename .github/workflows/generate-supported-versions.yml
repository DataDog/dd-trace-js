name: Generate Supported Versions

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, mq-working-branch-master-*]
  workflow_dispatch:
    inputs:
      node-range:
        description: Node.js semver range to intersect with the release line
        required: false
        default: '*'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  generate-supported-versions:
    name: Generate Supported Versions / generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node/latest
      - uses: ./.github/actions/install
      - name: Generate supported versions
        env:
          NODE_RANGE: ${{ inputs['node-range'] || '*' }}
        run: npm run generate:supported-integrations -- --node-range "$NODE_RANGE"
      - name: Prepare supported versions update
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only | sort -u)"
          if [ "$changed" != "supported_versions.json" ]; then
            echo "Unexpected paths changed during regeneration:" >&2
            echo "$changed" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ] ||
             [ "$BASE_REF" != "master" ] ||
             [ "$HEAD_REPO" != "$BASE_REPO" ] ||
             [[ "$HEAD_REF" == v*.x ]]; then
            echo "Out of date. Run 'npm run generate:supported-integrations' locally and commit." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/supported-versions"
          cp supported_versions.json "$RUNNER_TEMP/supported-versions/"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supported-versions
          path: ${{ runner.temp }}/supported-versions
          if-no-files-found: error

  update-supported-versions:
    name: Generate Supported Versions / update PR
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(startsWith(github.event.pull_request.head.ref, 'v') &&
        endsWith(github.event.pull_request.head.ref, '.x')) &&
      needs.generate-supported-versions.outputs.has_changes == 'true' &&
      github.actor != 'dd-octo-sts[bot]'
    runs-on: ubuntu-latest
    needs: generate-supported-versions
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/dd-trace-js
          policy: supported-integrations
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supported-versions
          path: ${{ runner.temp }}/supported-versions
      - name: Update supported_versions.json
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          set -euo pipefail

          jq -nc \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg expected "$EXPECTED" \
            --arg json "$(base64 -w 0 "$RUNNER_TEMP/supported-versions/supported_versions.json")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: "chore: update supported versions" },
                expectedHeadOid: $expected,
                fileChanges: { additions: [
                  { path: "supported_versions.json", contents: $json }
                ] }
              } }
            }' | gh api graphql --input - >/dev/null
