- description: "Lens-direct — performance.md flags an ungated channel.publish + an unbounded Map"
  vars:
    input: |
      Apply this repo's performance-review criteria (reviewers/performance.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/performance.md override, and _common.md) to the
      following instrumentation wrapper. No git checkout available — this snippet is the
      entire change to review.

      ```js
      const sessions = new Map()

      function onRequestStart (req) {
        sessions.set(req.headers['x-request-id'], req)
        channel.publish({ req })
      }
      ```
  assert:
    - type: icontains
      value: "hasSubscribers"
    - type: icontains-any
      value: ["unbounded", "high-cardinality", "high cardinality"]
    - type: not-icontains
      value: "BoundedMap"
      metric: no-hallucinated-toolkit-name
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags `channel.publish({ req })` as not gated on `channel.hasSubscribers` —
          this repo's performance override states that publish calls on instrumentation
          wrappers must be gated, since the wrapper body runs on every library call — and
          names the concrete fix (wrap the publish in a `channel.hasSubscribers` check).
        2. Separately flags that `sessions` is an unbounded Map keyed by a high-cardinality
          value (the `x-request-id` header) — the language-agnostic universal check number
          3 — and classifies the finding under this skill's P0/P1/P2 scale (not left as a
          bare "SEV-1" label with no P-mapping).
        3. Does not invent a Datadog-internal collection/utility type name that isn't part
          of this repo's real toolkit (e.g. a fictitious `BoundedMap` helper).
      threshold: 0.8

- description: "Full-pipeline — dd-apm-sdk-review skill on a pasted diff, no git"
  vars:
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/packages/datadog-instrumentations/src/example-lib.js b/packages/datadog-instrumentations/src/example-lib.js
      index 1111111..2222222 100644
      --- a/packages/datadog-instrumentations/src/example-lib.js
      +++ b/packages/datadog-instrumentations/src/example-lib.js
      @@ -10,6 +10,11 @@ addHook({ name: 'example-lib', versions: ['>=1'] }, (exampleLib) => {
      -    return handle.apply(this, arguments)
      +    sessions.set(req.headers['x-request-id'], req)
      +    channel.publish({ req })
      +    return handle.apply(this, arguments)
      +
      +  const sessions = new Map()
      ```
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const hit = calls.some((call) => {
          if (call.name !== 'Skill') return false;
          const blob = JSON.stringify(call.input || {});
          return blob.includes('dd-apm-sdk-review');
        });
        return hit || {
          pass: false,
          score: 0,
          reason: 'Skill tool was not invoked with dd-apm-sdk-review. toolCalls=' +
            JSON.stringify(calls.map((c) => ({ name: c.name, input: c.input })))
        };

    - type: icontains
      value: "pasted diff, no git"
    - type: icontains
      value: "Rule files used"
    - type: not-icontains
      value: "git diff"
      metric: no-attempted-git-commands
    - type: llm-rubric
      value: |
        The review report must satisfy ALL of the following, or it fails:
        1. Raises a performance finding on the ungated `channel.publish` call and/or the
          unbounded `sessions` Map keyed by `x-request-id`.
        2. Classifies every finding under this report's P0/P1/P2 sections — never leaves
          a finding stated only in the performance lens's internal SEV-1/SEV-2/SEV-3
          vocabulary with no P-level mapping.
        3. States an explicit verdict line (BLOCK, APPROVE_WITH_COMMENTS, or APPROVE) and
          a final READY TO PUSH / DO NOT PUSH statement.
      threshold: 0.8

- description: "Lens-direct — coherence.md flags a comment that contradicts the code beneath it"
  vars:
    input: |
      Apply this repo's coherence-review criteria (reviewers/coherence.md and _common.md) to
      the following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      // Retries the request up to 3 times with exponential backoff before giving up.
      function sendWithRetry (req) {
        return send(req)
      }
      ```
  assert:
    - type: icontains-any
      value: ["never retries", "does not retry", "doesn't retry", "only sends it once"]
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Names both sides of the contradiction — the comment claims retry-with-backoff
          behavior, but `sendWithRetry` calls `send` exactly once and never retries.
        2. Anchors the finding to the function/comment rather than a vague note with no
          location.
        3. Classifies the finding under this skill's P0/P1/P2 scale rather than leaving it
          unclassified.
      threshold: 0.8

- description: "Lens-direct — security.md flags a DSN with embedded credentials logged via log.debug"
  vars:
    input: |
      Apply this repo's security-review criteria (reviewers/security.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/security.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review. `config.dsn` is a full connection string with an embedded username and
      password, e.g. `amqp://user:password@host:5672`.

      ```js
      function onConnect (config) {
        log.debug('connecting with config %j', config)
      }
      ```
  assert:
    - type: icontains-any
      value: ["credential", "dsn", "password", "secret"]
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags `log.debug('connecting with config %j', config)` as logging a config
          object that contains credentials (the DSN's embedded username/password).
        2. States the failure mode — the credential ends up in logs, not just a style
          complaint.
        3. Treats the finding as needing private routing per this repo's disclosure rule,
          rather than proposing it be pasted into a public PR description.
      threshold: 0.8

- description: "Lens-direct — design.md flags a config option read directly from process.env"
  vars:
    input: |
      Apply this repo's design-review criteria (reviewers/design.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/design.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      function isExtraSlowModeEnabled () {
        return process.env.DD_TRACE_EXTRA_SLOW_MODE === 'true'
      }
      ```
  assert:
    - type: icontains
      value: "process.env"
    - type: icontains-any
      value: ["registration", "precedence", "config system", "supported-configurations"]
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags the direct `process.env.DD_TRACE_EXTRA_SLOW_MODE` read as bypassing this
          repo's config registration path instead of approving it as-is.
        2. Names the concrete consequence — precedence, validation, and telemetry are all
          skipped by a direct env read.
        3. Classifies the finding as at least P1.
      threshold: 0.8

- description: "Lens-direct — maintainability.md flags a silent empty catch block"
  vars:
    input: |
      Apply this repo's maintainability-review criteria (reviewers/maintainability.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/maintainability.md override, and _common.md) to
      the following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      function flushBuffer (buffer) {
        try {
          writeToSocket(buffer)
        } catch (e) {}
      }
      ```
  assert:
    - type: icontains
      value: "catch"
    - type: icontains-any
      value: ["log.error", "log.warn", "silent", "swallow"]
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags the empty `catch (e) {}` block as a silent swallow with no `log.error` /
          `log.warn` call.
        2. States the concrete failure mode — a write failure becomes invisible to anyone
          operating the system.
        3. Classifies the finding as at least P1.
      threshold: 0.8

- description: "Lens-direct — conventions.md flags async/await in production code"
  vars:
    input: |
      Apply this repo's codebase-conventions criteria (reviewers/conventions.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review. Assume it ships as part of the npm package, not a test file.

      ```js
      async function onSpanFinish (span) {
        await flushToAgent(span)
      }
      ```
  assert:
    - type: icontains-any
      value: ["async", "await"]
    - type: icontains-any
      value: ["production code", "npm package", "callback"]
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Flags the `async`/`await` usage as violating this repo's rule against
          async/await or promises in production code outside tests and worker threads.
        2. Names this as a dd-trace-js-specific convention violation, not a generic style
          opinion.
        3. Classifies the finding under this skill's P0/P1/P2 scale, at least P1.
      threshold: 0.8

- description: "Lens-direct — cross-sdk.md handles a new env var with no reachable spec source"
  vars:
    input: |
      Apply this repo's cross-SDK-consistency criteria (reviewers/cross-sdk.md and
      _common.md) to the following code. No git checkout available, and no network access
      is available in this environment — this snippet is the entire change to review.

      ```js
      config.batchFlushIntervalMs = getEnv('DD_TRACE_BATCH_FLUSH_INTERVAL')
      ```
  assert:
    - type: not-icontains
      value: "not cross-SDK relevant"
      metric: recognizes-env-var-as-relevant
    - type: llm-rubric
      value: |
        The review response must satisfy ALL of the following, or it fails:
        1. Recognizes this as cross-SDK relevant (a new env var / config option) rather
          than exiting early as not relevant.
        2. Given no network or gh access, reports NOT VERIFIED (no spec source available)
          or clearly states it cannot confirm the name/default against other SDKs — without
          fabricating a citation to a specific file/line in another SDK repo.
        3. Does not return a plain APPROVE with no verification note for this env var.
      threshold: 0.8
