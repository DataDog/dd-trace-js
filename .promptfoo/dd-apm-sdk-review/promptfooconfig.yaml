
# How to run this
#   cd dd-trace-js
#   promptfoo eval -c .promptfoo/dd-apm-sdk-review/promptfooconfig.yaml \
#     -o .promptfoo/dd-apm-sdk-review/results.json
#   promptfoo view

description: "dd-apm-sdk-review skill eval (local, no git — pasted diff / pasted snippet only)"

prompts:
  - "{{input}}"

providers:
  - id: anthropic:claude-agent-sdk
    label: "dd-apm-sdk-review via claude-agent-sdk"
    config:
      apiKeyRequired: false
      working_dir: "../.."
      setting_sources: ["project"]
      skills: ["dd-apm-sdk-review"]
      disallowed_tools: ["Bash"]
      permission_mode: "default"

defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-haiku-4-5-20251001
      config:
        temperature: 0

tests:
  - file://tests/dd-apm-sdk-review.yaml
