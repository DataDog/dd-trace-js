---
schema-version: v1
kind: mergequeue

enable: false

branches:
  master:
    enable: true

# Process pull requests independently to match the existing workflow and avoid
# speculative CI duplication.
workflow_type: noqueue
# The repository ruleset permits only squash merges.
merge_method: squash
# Prevent users from overriding the repository's squash-only policy.
allowed_merge_methods:
  - squash
# Always reuse existing checks instead of creating a merge queue working branch.
# Ten years comfortably exceeds the age of any realistic merge base.
noqueue_use_current_commit_tests_threshold_in_minutes: 5256000
# Always wait for GitLab CI instead of relying on automatic detection.
gitlab_check_enable: true
# Retry supported GitLab jobs to recover from transient infrastructure failures.
gitlab_jobs_retry_enable: true
# Let the full pipeline finish so automatic job retries can recover transient failures.
gitlab_fail_fast: false
# Avoid status-label events that can retrigger required checks and block the pull request.
skip_labels: true
