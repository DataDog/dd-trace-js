name: dd-trace-js-agent
version: "0.1"

# One file on purpose: the platform CLI errors if suites/ has more than one YAML
# ("Multiple suites … pass --suite") and CI does not pass --suite.
# AGENTS.md cases first; dd-apm-sdk-review skill cases after.
# All AGENTS.md inputs are answer-only: the agent may inspect the repository to ground an explanation, but no case asks it
# to modify files, execute commands, or complete an implementation. Content cases exercise AGENTS.md guidance.
# Prompts bound the response size so omissions remain easy for the judge to identify.
# Every repository-specific command and path is verified here because the comparative judge has no repository access.
cases:
  # AGENTS.md — Setup and Commands; Development Workflow.
  - id: dd-trace-js-package-manager-001
    files: [AGENTS.md]
    input: |
      I changed one dd-trace-js unit spec and need to install dependencies and run just that test.
      Which package manager and commands should I use? Should I run the root test script too?
      Answer in at most 4 bullets.
    expected_criteria:
      - Uses yarn install to install dependencies.
      - Runs the changed spec with ./node_modules/.bin/mocha path/to/test.spec.js.
      - Uses npm, not yarn, for any test script it recommends.
      - Does not recommend root npm test because it is intentionally disabled.
    bad_signals:
      - Uses yarn to run a test script.
      - Recommends root npm test.
      - Runs a broad suite before the changed spec.

  # AGENTS.md — Testing: plugin and service-backed plugin test commands.
  - id: dd-trace-js-plugin-tests-002
    files: [AGENTS.md]
    input: |
      I changed the amqplib plugin and its tests require the docker compose service named rabbitmq.
      Give me only the commands needed to run that plugin's service-backed tests, including the exporter cleanup.
    expected_criteria:
      - Unsets OTEL_TRACES_EXPORTER, OTEL_LOGS_EXPORTER, and OTEL_METRICS_EXPORTER.
      - Starts the service with docker compose up -d rabbitmq.
      - Runs SERVICES="rabbitmq" PLUGINS="amqplib" npm run test:plugins:ci.
    bad_signals:
      - Uses yarn to run the plugin test script.
      - Omits SERVICES="rabbitmq" from the service-backed test command.
      - Omits PLUGINS="amqplib" from the service-backed test command.
      - Uses PLUGINS="amqplib" npm run test:plugins instead of the service-backed command.

  # AGENTS.md — Testing: strict assertions, rejected promises, pinned errors, and boundary values.
  - id: dd-trace-js-test-boundaries-004
    files: [AGENTS.md]
    input: |
      I fixed a limit that accepts up to 32 entries and rejects additional entries with ERR_LIMIT.
      What boundary tests and assertion style should cover it? Answer in at most 4 bullets.
    expected_criteria:
      - Tests 32 as the last accepted value and 33 as the first rejected value.
      - Uses node:assert/strict.
      - Uses assert.rejects for the rejected promise.
      - Pins the rejected error code to ERR_LIMIT.
    bad_signals:
      - Does not test 32 as an accepted value.
      - Does not test 33 as the first rejected value.
      - Uses manual try/catch plus assert.fail without explaining why assert.rejects is unsuitable.
      - Does not assert the error code.

  # AGENTS.md — Development Workflow and Testing: real entry points and observable output.
  - id: dd-trace-js-real-path-tests-007
    files: [AGENTS.md]
    input: |
      A plugin regression test bypasses the normal loader, replaces the tracer with a small stub, invokes a plugin
      method directly, and only asserts calls to the stub. Is this sufficient, and what should replace it?
      Answer in at most 4 bullets.
    expected_criteria:
      - States that the existing test is insufficient because it bypasses the real production entry point.
      - Replaces it with a test that exercises the real production entry point.
      - Asserts observable output rather than calls made to the tracer stub.
      - Does not add production exports or hooks solely to make the test possible.
    bad_signals:
      - Accepts direct invocation against a stub tracer as sufficient.
      - Tests only internal calls instead of observable behavior.
      - Changes the production API solely for the test.

  # AGENTS.md — Debugging Failures.
  - id: dd-trace-js-hung-ci-009
    files: [AGENTS.md]
    input: |
      After my change, CI prints a TypeError and then hangs until timeout. Can I classify it as flaky and raise the
      timeout? Answer in at most 4 bullets.
    expected_criteria:
      - Investigates the TypeError as the last meaningful error before treating the job as merely slow.
      - Inspects for leaked handles before treating the job as merely slow.
      - >
        Requires evidence before calling the failure flaky, such as a tracked known flake or a passing rerun plus a
        credible nondeterminism mechanism.
      - Rejects increasing the timeout to hide the hang and says to fix the underlying cause.
    bad_signals:
      - Calls the failure flaky merely because the job timed out.
      - Assumes a leaked handle without inspecting one.
      - Recommends increasing the timeout without investigating the earlier error.

  # AGENTS.md — Cross-Cutting Configuration Changes: steps 1, 2, 4, 5, and unit suffixes.
  - id: dd-trace-js-new-configuration-010
    files: [AGENTS.md]
    input: |
      I am adding a DD_ environment variable for a byte limit that is also exposed through tracer.init().
      Which core configuration files must change, when does telemetry change, and how should the option be named?
      Answer in at most 5 bullets.
    expected_criteria:
      - Adds the default in packages/dd-trace/src/config/defaults.js.
      - Maps the environment variable in packages/dd-trace/src/config/index.js.
      - Updates packages/dd-trace/src/config/supported-configurations.json.
      - Adds the telemetry mapping when applicable.
      - Uses a unit suffix, such as maxBytes.
    bad_signals:
      - Adds the environment variable without a default.
      - Omits the environment-variable mapping in packages/dd-trace/src/config/index.js.
      - Omits packages/dd-trace/src/config/supported-configurations.json.
      - Treats telemetry as mandatory even when it is not applicable.
      - Uses a size option name without a unit suffix.

  # AGENTS.md — Production Safety and Performance: performance-motivated complexity.
  - id: dd-trace-js-hot-path-review-011
    files: [AGENTS.md]
    input: |
      A production hot-path change replaces values.map(format) with a more complex loop solely because it is expected
      to be faster. What evidence is required, and when should the readable implementation remain? Answer in at most
      4 bullets.
    expected_criteria:
      - Requires a focused, reproducible microbenchmark before accepting the complexity.
      - Keeps the readable implementation when results are within roughly ±2%.
      - Requires commit-body justification for a result around 5%.
      - Keeps gains of at least 10% only when they are reproducible and reported with numbers.
    bad_signals:
      - Accepts the loop as faster without benchmark evidence.
      - Treats any measured improvement as sufficient to keep the more complex code.

  # AGENTS.md — Production Safety and Performance: no async/await in shipped production code.
  - id: dd-trace-js-production-async-012
    files: [AGENTS.md]
    input: |
      May I add async/await to ordinary shipped tracer production code?
      Answer in at most 3 bullets and mention every stated exception.
    expected_criteria:
      - Rejects adding async/await to ordinary shipped production code.
      - Notes that async/await is allowed in tests.
      - Notes that async/await is allowed in worker threads.
    bad_signals:
      - Accepts adding async/await to ordinary shipped production code.
      - Claims async/await is forbidden in tests.
      - Claims async/await is forbidden in worker threads.

  # AGENTS.md — Backportability and Cross-Cutting Configuration Changes: public surfaces, docs, and tests.
  - id: dd-trace-js-public-config-surfaces-013
    files: [AGENTS.md]
    input: |
      I am adding a public, non-experimental tracer.init() option that is not version-specific.
      Which type, documentation, and test surfaces must change? Answer in at most 3 bullets.
    expected_criteria:
      - Updates both supported public TypeScript surfaces.
      - Documents the option in docs/API.md.
      - Tests the option in packages/dd-trace/test/config/index.spec.js.
    bad_signals:
      - Updates only one public TypeScript surface.
      - Omits docs/API.md.
      - Omits packages/dd-trace/test/config/index.spec.js.

  # AGENTS.md — Production Safety and Performance: no promises in shipped production code.
  - id: dd-trace-js-production-promises-014
    files: [AGENTS.md]
    input: |
      May I add a promise-returning helper without async syntax to ordinary shipped tracer production code?
      Answer in at most 3 bullets and mention every stated exception.
    expected_criteria:
      - Rejects adding a promise-returning helper to ordinary shipped production code.
      - Notes that promises are allowed in tests.
      - Notes that promises are allowed in worker threads.
    bad_signals:
      - Accepts adding a promise-returning helper to ordinary shipped production code.
      - Claims promises are forbidden in tests.
      - Claims promises are forbidden in worker threads.

  # dd-apm-sdk-review skill cases.
  - id: js-perf-lens-ungated-publish
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/performance.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/performance.md
    input: |
      Apply this repo's performance-review criteria (reviewers/performance.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/performance.md override, and _common.md) to the
      following instrumentation wrapper. No git checkout available — this snippet is the
      entire change to review.

      ```js
      const sessions = new Map()

      function onRequestStart (req) {
        sessions.set(req.headers['x-request-id'], req)
        channel.publish({ req })
      }
      ```
    expected_criteria:
      - Flags `channel.publish({ req })` as not gated on `channel.hasSubscribers` — this
        repo's performance override states explicitly that publish calls on instrumentation
        wrappers must be gated, since the wrapper body runs on every library call.
      - Also flags, independently or as part of the same finding, that `sessions` is an
        unbounded Map keyed by a high-cardinality value (the `x-request-id` header) — the
        language-agnostic universal check number 3 (unbounded memory/collection), mapped to
        P0 or P1 per the core performance.md's SEV-to-P mapping section, not left as a bare
        SEV-1 label.
      - Names the concrete fixes — gate the publish call on `channel.hasSubscribers`, and
        bound the map (by count and bytes, or don't key it by request id at all).
      - The final verdict is BLOCK.
    bad_signals:
      - Treats the ungated `channel.publish` call as a style nit rather than a hot-path
        cost concern (it runs on every request, per the override's "Hot paths" section).
      - Misses the unbounded / high-cardinality Map entirely.
      - Invents a Datadog-internal collection/utility type that doesn't exist in this
        repo's real toolkit (e.g. a fictitious `BoundedMap` helper).

  - id: js-correctness-inverted-condition
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/correctness.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
    input: |
      Apply this repo's correctness-review criteria (reviewers/correctness.md and _common.md) to
      the following change. No git checkout available — this snippet is the entire change to
      review.

      ```js
      // Skip sampling when the span budget has been exhausted.
      function shouldSample (spanCount, maxSpans) {
        return spanCount < maxSpans
      }

      function onSpanFinish (span, tracer) {
        if (shouldSample(tracer.spanCount, tracer.maxSpans)) {
          return
        }
        tracer.record(span)
      }
      ```
    expected_criteria:
      - Flags that `onSpanFinish` records spans once the budget is exhausted and skips
        recording while under budget — the condition is inverted relative to the comment's
        stated intent ("skip sampling when the span budget has been exhausted").
      - Cites the concrete failure case, e.g. spanCount below maxSpans returns early and never
        calls `tracer.record`, while spanCount at or above maxSpans falls through and records.
      - Does not comment on architecture, style, or performance — only the logic defect.
    bad_signals:
      - Approves the change or treats the inverted condition as a style nit.
      - Comments on module placement, naming, or allocation cost instead of the logic defect.
      - Flags the defect without naming a concrete input/state that demonstrates it.

  - id: js-perf-pipeline-full-review
    files:
      - .agents/skills/dd-apm-sdk-review/SKILL.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/skills/dd-apm-sdk-review/reviewers/coherence.md
      - .agents/skills/dd-apm-sdk-review/reviewers/correctness.md
      - .agents/skills/dd-apm-sdk-review/reviewers/security.md
      - .agents/skills/dd-apm-sdk-review/reviewers/design.md
      - .agents/skills/dd-apm-sdk-review/reviewers/performance.md
      - .agents/skills/dd-apm-sdk-review/reviewers/maintainability.md
      - .agents/skills/dd-apm-sdk-review/reviewers/conventions.md
      - .agents/skills/dd-apm-sdk-review/reviewers/cross-sdk.md
      - .agents/skills/dd-apm-sdk-review/reviewers/report-template.md
      - .agents/dd-apm-sdk-review-overrides/repo-context.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/security.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/design.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/performance.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/maintainability.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md
    input: |
      Run dd-apm-sdk-review on the following change. There is no git repository to
      inspect — this diff is the entire change set; do not attempt any git commands, go
      straight to running the reviewers on the pasted content below.

      ```diff
      diff --git a/packages/datadog-instrumentations/src/example-lib.js b/packages/datadog-instrumentations/src/example-lib.js
      index 1111111..2222222 100644
      --- a/packages/datadog-instrumentations/src/example-lib.js
      +++ b/packages/datadog-instrumentations/src/example-lib.js
      @@ -10,6 +10,11 @@ addHook({ name: 'example-lib', versions: ['>=1'] }, (exampleLib) => {
      +  const sessions = new Map()
      -    return handle.apply(this, arguments)
      +    sessions.set(req.headers['x-request-id'], req)
      +    channel.publish({ req })
      +    return handle.apply(this, arguments)
      ```
    expected_criteria:
      - The report's Mode line states pasted diff / no git (e.g. "pasted diff, no git").
      - Includes a "Rule files used" section listing which reviewer files were used, per
        report-template.md.
      - Raises a performance finding on the ungated `channel.publish` call and/or the
        unbounded `sessions` Map keyed by `x-request-id`, classified under the report's
        P0/P1/P2 sections, not the performance lens's internal SEV vocabulary.
      - "States an explicit verdict line (BLOCK / APPROVE_WITH_COMMENTS / APPROVE) and the matching gate line: `DO NOT PUSH` on BLOCK, `WAITING ON HUMAN` on APPROVE_WITH_COMMENTS, or `READY TO PUSH` on APPROVE."
    bad_signals:
      - Attempts to run git commands despite the change set being pasted inline.
      - Skips straight to a verdict with no per-lens findings or "Rule files used" section.
      - Reports SEV-1 / SEV-2 labels in the final report without resolving them to
        P0/P1/P2.

  - id: js-full-skill-simple-review
    files:
      - .agents/skills/dd-apm-sdk-review/SKILL.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/skills/dd-apm-sdk-review/reviewers/coherence.md
      - .agents/skills/dd-apm-sdk-review/reviewers/correctness.md
      - .agents/skills/dd-apm-sdk-review/reviewers/security.md
      - .agents/skills/dd-apm-sdk-review/reviewers/design.md
      - .agents/skills/dd-apm-sdk-review/reviewers/performance.md
      - .agents/skills/dd-apm-sdk-review/reviewers/maintainability.md
      - .agents/skills/dd-apm-sdk-review/reviewers/conventions.md
      - .agents/skills/dd-apm-sdk-review/reviewers/cross-sdk.md
      - .agents/skills/dd-apm-sdk-review/reviewers/report-template.md
      - .agents/dd-apm-sdk-review-overrides/repo-context.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/security.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/design.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/performance.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/maintainability.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md
    input: |
      Run the complete dd-apm-sdk-review skill on this small change. There is no git
      repository to inspect — this pasted diff is the entire change set. Run every
      reviewer in the skill's roster and produce the consolidated final report.

      ```diff
      diff --git a/packages/dd-trace/src/feature.js b/packages/dd-trace/src/feature.js
      index 1111111..2222222 100644
      --- a/packages/dd-trace/src/feature.js
      +++ b/packages/dd-trace/src/feature.js
      @@ -1,3 +1,4 @@
      -function shouldRecord (enabled) {
      -  return enabled
      -}
      +function shouldRecord (enabled) {
      +  // Record only when the feature is enabled.
      +  return !enabled
      +}
      ```
    expected_criteria:
      - The report's Mode line states pasted diff / no git.
      - Includes a "Rule files used" section covering every reviewer in the roster —
        coherence, correctness, security, design, performance, maintainability,
        conventions, and cross-SDK consistency.
      - Includes a "Related skills in this repo" section derived from repo-context.md,
        including at least `apm-integrations` and `architecture-review`.
      - Flags the inverted return value — `shouldRecord(true)` now returns false and
        `shouldRecord(false)` returns true, contradicting the comment and prior behavior.
      - Classifies the finding using P0/P1/P2, states an explicit verdict, and ends with
        the matching gate line (`DO NOT PUSH` / `WAITING ON HUMAN` / `READY TO PUSH`)
        consistently with that verdict.
    bad_signals:
      - Attempts to run git commands despite the complete change being pasted inline.
      - Reviews only the obvious logic defect without producing the complete consolidated
        report and the bookkeeping sections.
      - Omits one or more reviewers from the "Rule files used" roster.
      - Approves the inverted `shouldRecord` behavior or claims it matches the comment.

  - id: js-coherence-comment-contradicts-code
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/coherence.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
    input: |
      Apply this repo's coherence-review criteria (reviewers/coherence.md and _common.md) to
      the following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      // Retries the request up to 3 times with exponential backoff before giving up.
      function sendWithRetry (req) {
        return send(req)
      }
      ```
    expected_criteria:
      - Names both sides of the contradiction — the comment claims retry-with-backoff
        behavior, but `sendWithRetry` calls `send` exactly once and never retries.
      - Anchors the finding to the function/comment, not a vague "misleading comment" note
        with no location.
      - Classifies the finding under this skill's P0/P1/P2 scale rather than leaving it
        unclassified.
    bad_signals:
      - Treats this as a naming/style nit instead of naming the comment-vs-code
        contradiction.
      - Claims the code retries when it does not.
      - Reviews performance or design concerns instead of the coherence contradiction.

  - id: js-security-secret-into-log
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/security.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/security.md
    input: |
      Apply this repo's security-review criteria (reviewers/security.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/security.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review. `config.dsn` is a full connection string with an embedded username and
      password, e.g. `amqp://user:password@host:5672`.

      ```js
      function onConnect (config) {
        log.debug('connecting with config %j', config)
      }
      ```
    expected_criteria:
      - Flags `log.debug('connecting with config %j', config)` as logging a config object
        that contains credentials (the DSN's embedded username/password) — this repo's
        security override and the generic security.md both call out config values that may
        contain secrets (API keys, DSNs, passwords in URLs).
      - States the failure mode — the credential ends up in logs, a customer-visible or
        persisted place, not just a style complaint.
      - Classifies the finding at a severity consistent with _common.md's P0 bar for a
        security/privacy defect, or explicitly justifies a lower severity — does not leave
        it unclassified or downgrade it to a bare style nit.
      - Treats this finding as needing private routing per this repo's disclosure rule,
        rather than proposing it be pasted verbatim into a wide-audience PR description.
    bad_signals:
      - Misses the logged secret entirely (e.g., only comments on log level or format
        string style).
      - Reports this only as a P2 style issue.
      - Suggests pasting the finding's detail directly into a public PR description.

  - id: js-design-bypasses-config-registration
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/design.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/design.md
      - AGENTS.md
    input: |
      Apply this repo's design-review criteria (reviewers/design.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/design.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      function isExtraSlowModeEnabled () {
        return process.env.DD_TRACE_EXTRA_SLOW_MODE === 'true'
      }
      ```
    expected_criteria:
      - Flags the direct `process.env.DD_TRACE_EXTRA_SLOW_MODE` read as bypassing this
        repo's config registration path (defaults, `#applyEnvs()`,
        `supported-configurations.json`, telemetry), per design.md's "Configuration
        surface" check and AGENTS.md's "Cross-Cutting Configuration Changes" checklist.
      - Names the concrete consequence — precedence (programmatic config vs env var vs
        remote config vs default), validation, and telemetry are all skipped by a direct
        env read.
      - Classifies the finding as at least P1 rather than approving the snippet as-is.
    bad_signals:
      - Approves the direct `process.env` read with no config-registration concern.
      - Invents a config file path or step that does not exist in this repo.

  - id: js-maintainability-silent-catch
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/maintainability.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/maintainability.md
    input: |
      Apply this repo's maintainability-review criteria (reviewers/maintainability.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/maintainability.md override, and _common.md) to
      the following code. No git checkout available — this snippet is the entire change to
      review.

      ```js
      function flushBuffer (buffer) {
        try {
          writeToSocket(buffer)
        } catch (e) {}
      }
      ```
    expected_criteria:
      - Flags the empty `catch (e) {}` block as a silent swallow with no `log.error` /
        `log.warn` call, contradicting AGENTS.md's rule to catch and log errors rather
        than crash user apps, and this lens's own "Error handling and observability" check.
      - States the concrete failure mode — a write failure becomes invisible to anyone
        operating the system, with no log line and no telemetry.
      - Classifies the finding as at least P1, per maintainability.md's own bar for a
        silent catch/swallow that drops context.
    bad_signals:
      - Does not mention the empty catch block at all.
      - Treats this as a performance or security issue instead of an
        observability/maintainability one.

  - id: js-conventions-async-in-production-path
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/conventions.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
      - .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md
      - AGENTS.md
    input: |
      Apply this repo's codebase-conventions criteria (reviewers/conventions.md, its
      .agents/dd-apm-sdk-review-overrides/reviewers/conventions.md override, and _common.md) to the
      following code. No git checkout available — this snippet is the entire change to
      review. Assume it ships as part of the npm package, not a test file.

      ```js
      async function onSpanFinish (span) {
        await flushToAgent(span)
      }
      ```
    expected_criteria:
      - Flags the `async`/`await` usage as violating AGENTS.md's explicit rule that
        production code (outside tests and worker threads) must not use `async`/`await` or
        promises, and must use callbacks or synchronous patterns instead.
      - Names this as a dd-trace-js-specific convention violation, not a generic style
        opinion, and anchors it to the snippet.
      - Classifies the finding under this skill's P0/P1/P2 scale, at least P1.
    bad_signals:
      - Approves the `async`/`await` usage without flagging the rule.
      - Confuses this with an unrelated style rule (e.g. `for-in`) instead of the
        async/await prohibition.

  - id: js-cross-sdk-new-env-var-not-verified
    files:
      - .agents/skills/dd-apm-sdk-review/reviewers/cross-sdk.md
      - .agents/skills/dd-apm-sdk-review/reviewers/_common.md
    input: |
      Apply this repo's cross-SDK-consistency criteria (reviewers/cross-sdk.md and
      _common.md) to the following code. No git checkout available, and no network access
      is available in this environment — this snippet is the entire change to review.

      ```js
      config.batchFlushIntervalMs = getEnv('DD_TRACE_BATCH_FLUSH_INTERVAL')
