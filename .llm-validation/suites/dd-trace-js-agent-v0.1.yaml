name: dd-trace-js-agent
version: "0.1"

# All inputs are answer-only: the agent may inspect the repository to ground an explanation, but no case asks it
# to modify files, execute commands, or complete an implementation. Content cases exercise AGENTS.md guidance.
# Prompts bound the response size so omissions remain easy for the judge to identify.
# Every repository-specific command and path is verified here because the comparative judge has no repository access.
cases:
  # AGENTS.md — Setup and Commands; Development Workflow.
  - id: dd-trace-js-package-manager-001
    files: [AGENTS.md]
    input: |
      I changed one dd-trace-js unit spec and need to install dependencies and run just that test.
      Which package manager and commands should I use? Should I run the root test script too?
      Answer in at most 4 bullets.
    expected_criteria:
      - Uses bun install to install dependencies.
      - Runs the changed spec with ./node_modules/.bin/mocha path/to/test.spec.js.
      - Uses npm, not bun or yarn, for any test script it recommends.
      - Does not recommend root npm test because it is intentionally disabled.
    bad_signals:
      - Uses bun or yarn to run a test script.
      - Recommends root npm test.
      - Runs a broad suite before the changed spec.

  # AGENTS.md — Testing: plugin and service-backed plugin test commands.
  - id: dd-trace-js-plugin-tests-002
    files: [AGENTS.md]
    input: |
      I changed the amqplib plugin and its tests require the docker compose service named rabbitmq.
      My shell has a SPEC filter from another plugin. I want to run all amqplib specs.
      Give me only the commands needed to run that plugin's service-backed tests, including the exporter cleanup.
    expected_criteria:
      - Unsets OTEL_TRACES_EXPORTER, OTEL_LOGS_EXPORTER, and OTEL_METRICS_EXPORTER.
      - Clears the inherited SPEC filter before running the plugin tests.
      - Starts the service with docker compose up -d rabbitmq.
      - Runs SERVICES="rabbitmq" PLUGINS="amqplib" npm run test:plugins:ci.
    bad_signals:
      - Uses yarn to run the plugin test script.
      - Leaves the inherited SPEC filter active.
      - Omits SERVICES="rabbitmq" from the service-backed test command.
      - Omits PLUGINS="amqplib" from the service-backed test command.
      - Uses PLUGINS="amqplib" npm run test:plugins instead of the service-backed command.

  # AGENTS.md — Testing: strict assertions, rejected promises, pinned errors, and boundary values.
  - id: dd-trace-js-test-boundaries-004
    files: [AGENTS.md]
    input: |
      I fixed a promise-returning API that accepts up to 32 entries and rejects additional entries with ERR_LIMIT.
      What boundary tests and assertion style should cover it? Answer in at most 4 bullets.
    expected_criteria:
      - Tests 32 as the last accepted value and 33 as the first rejected value.
      - Uses node:assert/strict.
      - Uses assert.rejects for the rejected promise.
      - Pins the rejected error code to ERR_LIMIT.
    bad_signals:
      - Does not test 32 as an accepted value.
      - Does not test 33 as the first rejected value.
      - Uses manual try/catch plus assert.fail without explaining why assert.rejects is unsuitable.
      - Does not assert the error code.

  # AGENTS.md — Development Workflow and Testing: real entry points and observable output.
  - id: dd-trace-js-real-path-tests-007
    files: [AGENTS.md]
    input: |
      A regression occurs when an application loads an instrumented library: its spans are missing.
      The proposed test bypasses the normal loader, replaces the tracer with a stub, invokes a plugin method directly,
      and only asserts calls to the stub. Is this sufficient coverage for the regression, and what should replace it?
      Answer in at most 4 bullets.
    expected_criteria:
      - States that the existing test is insufficient because it bypasses the real production entry point.
      - Replaces it with a test that exercises the real production entry point.
      - Asserts observable output rather than calls made to the tracer stub.
      - Does not add production exports or hooks solely to make the test possible.
    bad_signals:
      - Accepts direct invocation against a stub tracer as sufficient.
      - Tests only internal calls instead of observable behavior.
      - Changes the production API solely for the test.

  # AGENTS.md — Debugging Failures.
  - id: dd-trace-js-hung-ci-009
    files: [AGENTS.md]
    input: |
      After my change, CI prints a TypeError and then hangs until timeout. Can I classify it as flaky and raise the
      timeout? Answer in at most 4 bullets.
    expected_criteria:
      - Investigates the TypeError as the last meaningful error before treating the job as merely slow.
      - Inspects for leaked handles before treating the job as merely slow.
      - >
        Requires evidence before calling the failure flaky, such as a tracked known flake or a passing rerun plus a
        credible nondeterminism mechanism.
      - Rejects increasing the timeout to hide the hang and says to fix the underlying cause.
    bad_signals:
      - Calls the failure flaky merely because the job timed out.
      - Assumes a leaked handle without inspecting one.
      - Recommends increasing the timeout without investigating the earlier error.

  # AGENTS.md — Cross-Cutting Configuration Changes: registry, generated types, telemetry, and unit suffixes.
  - id: dd-trace-js-new-configuration-010
    files: [AGENTS.md]
    input: |
      I am adding a DD_ environment variable for a byte limit, also exposed through tracer.init().
      It uses the existing integer parser and needs no custom transformation or calculated default.
      Which configuration files and generated artifacts must change, and how should the option be named?
      Answer in at most 5 bullets.
    expected_criteria:
      - >-
        Recommends registering the DD_ variable in packages/dd-trace/src/config/supported-configurations.json
        with its default, type and programmatic name (configurationNames) for tracer.init().
      - >-
        Explains that defaults and environment/programmatic parsing are derived from the registry by
        config/defaults.js and config/index.js.
      - >-
        Explains that canonical configuration telemetry is registry-derived, without a required per-option name
        mapping in telemetry/telemetry.js.
      - >-
        Recommends running npm run generate:config:types and committing the generated configuration types.
      - Recommends a unit suffix, such as maxBytes.
    bad_signals:
      - Recommends adding the environment variable without specifying a default in its registry entry.
      - Omits the registry mapping that exposes the option through tracer.init().
      - Omits packages/dd-trace/src/config/supported-configurations.json.
      - Requires manual defaults, env mapping or telemetry name mapping for this registry-backed option.
      - Recommends a size option name without a unit suffix.

  # AGENTS.md — Production Safety and Performance: performance-motivated complexity.
  - id: dd-trace-js-hot-path-review-011
    files: [AGENTS.md]
    input: |
      A production hot-path change replaces values.map(format) with a more complex loop solely because it is expected
      to be faster. What should I record for a one-off benchmark, and when should the readable implementation remain?
      Do I need a lasting benchmark? Answer in at most 4 bullets.
    expected_criteria:
      - Requires reproducible measurement before accepting the complexity.
      - Keeps the readable implementation when results are within roughly ±2%.
      - Keeps gains of at least 5% only when they are reproducible and reported with numbers.
      - Requires a lasting benchmark only for a stable workload that warrants a regression guard.
      - For a temporary benchmark, records the workload, runtime, baseline, candidate, and results.
    bad_signals:
      - Accepts the loop as faster without benchmark evidence.
      - Treats any measured improvement as sufficient to keep the more complex code.

  # AGENTS.md — Production Safety and Performance: synchronous and inactive paths.
  - id: dd-trace-js-production-async-012
    files: [AGENTS.md]
    input: |
      May I make a synchronous span-processing hot path async just to simplify its implementation, including when
      the feature is disabled? Would returning a promise without async syntax be acceptable instead?
      Does the same restriction apply to tests and worker threads? Answer in at most 3 bullets.
    expected_criteria:
      - >
        Rejects adding promise machinery to the synchronous hot path regardless of async syntax and keeps the
        inactive path cheap.
      - Notes that async/await is allowed in tests.
      - Notes that async/await is allowed in worker threads.
    bad_signals:
      - Accepts making the synchronous hot path async or adding promise machinery when the feature is disabled.
      - Accepts a promise-returning helper on the synchronous hot path because it avoids async syntax.
      - Claims async/await is forbidden in tests.
      - Claims async/await is forbidden in worker threads.

  # AGENTS.md — Backportability and Cross-Cutting Configuration Changes: public surfaces, docs, and tests.
  - id: dd-trace-js-public-config-surfaces-013
    files: [AGENTS.md]
    input: |
      I am adding a public, non-experimental tracer.init() option that is not version-specific.
      The option needs no changes to the API guide.
      Which type, documentation, and test surfaces must change? Answer in at most 3 bullets.
    expected_criteria:
      - Updates index.d.ts and index.d.v5.ts, the two supported public TypeScript surfaces.
      - Documents the option in its public declaration comments.
      - Tests the option in packages/dd-trace/test/config/index.spec.js.
    bad_signals:
      - Updates only one public TypeScript surface.
      - Requires a docs/API.md edit for this option.
      - Omits packages/dd-trace/test/config/index.spec.js.

  # AGENTS.md — Production Safety and Performance: inherently asynchronous production APIs.
  - id: dd-trace-js-production-promises-014
    files: [AGENTS.md]
    input: |
      A shipped control-plane API already returns a promise and calls an inherently asynchronous upstream API.
      May its implementation use async/await or a promise-returning helper?
      Must an already asynchronous request API become synchronous? Answer in at most 3 bullets.
    expected_criteria:
      - Allows async/await or promise helpers when they preserve the existing asynchronous API contract.
      - Preserves existing asynchronous request contracts without adding avoidable promise overhead.
    bad_signals:
      - Forbids promises or async/await in all shipped production code.

  # AGENTS.md — Cross-Cutting Configuration Changes: scope and version-specific surfaces.
  - id: dd-trace-js-config-scope-015
    files: [AGENTS.md]
    input: |
      I am adding a public tracer byte limit configured only through an environment variable.
      Do I need configurationNames, public option declarations, or a docs/API.md edit?
      Which public declaration file should document a separate v5-only option? Answer in at most 4 bullets.
    expected_criteria:
      - Does not require configurationNames, public declarations, or a docs/API.md edit for the environment-only option.
      - Updates only index.d.v5.ts and its declaration comments for the v5-only public option.
    bad_signals:
      - Treats every environment variable as a public tracer.init() option.
      - Requires edits to both public type surfaces for the explicitly v5-only option.
      - Requires a docs/API.md edit for the environment-only option.

  # AGENTS.md — Cross-Cutting Configuration Changes: custom behavior and configuration sources.
  - id: dd-trace-js-custom-configuration-016
    files: [AGENTS.md]
    input: |
      A configuration change needs behavior the existing registry machinery cannot express and changes a configuration
      source. Must I avoid runtime configuration and telemetry changes? Which tests should cover the change?
      Answer in at most 3 bullets.
    expected_criteria:
      - Allows runtime configuration or telemetry changes when the registry cannot express the behavior.
      - Tests the configuration behavior in packages/dd-trace/test/config/index.spec.js.
      - Adds telemetry tests for the added or changed configuration source.
    bad_signals:
      - Forbids runtime configuration or telemetry edits for all registry-backed settings.
      - Omits telemetry coverage for the changed configuration source.
